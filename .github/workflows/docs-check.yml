# Fails when the public API is undocumented, has broken links, or the docs do not build.
# Validation rules are configured in typedoc.json.
name: Docs Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run doc
